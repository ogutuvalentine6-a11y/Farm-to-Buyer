services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
    ports: ["8000:8000"]
    depends_on: [mongo]
    volumes: [./static:/app/static]
  mongo-express:
    image: mongo-express:1.0
    restart: unless-stopped
    ports: ["8081:8081"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
    depends_on: [mongo]
volumes:
  mongo_data:
